method: drifting
experiment: nested_subset_consistency
drifting:
  samples_per_condition: 4
  radii: [0.02, 0.05, 0.2]
  feature_grid: 4
  contradiction_repulsion_strength: 0.0
  nested_identity_weight: 0.5
  nested_contraction_weight: 0.5
  nested_pool_size: 2
  nested_contraction_margin: 0.0
subset_pairing:
  require_strict_superset: true
  share_noise: true
  richer_branch_is_teacher: true
evaluation:
  required: [subset_identity_error, posterior_contraction_rate, unseen_subset_dice]
