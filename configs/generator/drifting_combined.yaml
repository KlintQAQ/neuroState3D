method: drifting
experiment: contradiction_plus_nested_subset
drifting:
  samples_per_condition: 4
  radii: [0.02, 0.05, 0.2]
  feature_grid: 4
  contradiction_repulsion_strength: 2.0
  contradiction_max_weight: 6.0
  nested_identity_weight: 0.5
  nested_contraction_weight: 0.5
  nested_pool_size: 2
  nested_contraction_margin: 0.0
negative_bank:
  capacity: 128
  samples_per_condition: 4
  target_keyed: true
subset_pairing:
  require_strict_superset: true
  share_noise: true
evaluation:
  required: [et_dice, tc_dice, contradiction_rate, posterior_contraction_rate, latency_ms]
